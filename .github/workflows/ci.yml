name: CI

# Gerbang mutu sebelum deploy. Dua job:
#   1. quality — selalu jalan, tanpa env. typegen → tsc → ESLint → test, hard-fail.
#              `next typegen` WAJIB sebelum tsc: tipe route global (LayoutProps,
#              PageProps, ...) baru ada setelahnya — .next & next-env.d.ts di-gitignore,
#              jadi checkout bersih tidak punya tipe tsb tanpa langkah ini.
#   2. build   — butuh env Supabase (prerender query DB saat build). Key server-only
#              (tanpa prefix NEXT_PUBLIC) diinjeksi via next.config.ts.
#              Bila secrets belum diatur di GitHub, dilewati dengan pemberitahuan
#              alih-alih gagal merah yang membingungkan.
#
# Setup satu kali (Repo → Settings → Secrets and variables → Actions):
#   Secrets : SUPABASE_URL, SUPABASE_ANON_KEY (URL publik — boleh juga sebagai Variable)
# Catatan: RESEND/ADMIN_EMAIL/GEMINI tidak dibutuhkan saat build; NEXT_PUBLIC_APP_NAME
# sudah tidak dipakai aplikasi.

on:
  push:
    branches: [main]
  pull_request:

# Hindari run tumpang tindih yang boros saat push beruntun.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: TypeScript, ESLint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Versi sama persis dengan lingkungan dev lokal (parity build).
          node-version: 24
          cache: npm

      - name: Install dependensi
        run: npm ci

      # Generate next-env.d.ts + tipe route global (.next/types) tanpa full build.
      # Bila gagal (mis. env build tak cukup memuat next.config), langkah tsc
      # di bawah ikut tertolak — fail-closed.
      - name: Generate route types
        run: npx next typegen

      # Gerbang keras: error TypeScript menggagalkan CI.
      # (next.config.ts juga sudah `ignoreBuildErrors: false`.)
      - name: TypeScript
        run: npx tsc --noEmit

      # Gerbang keras: error ESLint menggagalkan CI (P1.4 — baseline 94 error → 0).
      # Pelanggaran yang memang disengaja didokumentasikan lewat eslint-disable
      # di lokasinya masing-masing, bukan dengan menurunkan aturan secara global.
      - name: ESLint
        run: npm run lint

      # Aturan pemilik repo: `npm test` wajib hijau sebelum commit — CI kini
      # memverifikasi hal yang sama.
      - name: Test
        run: npm run test

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: quality
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependensi
        run: npm ci

      - name: Build
        if: env.SUPABASE_URL != ''
        run: npm run build

      - name: Env belum diatur — build dilewati
        if: env.SUPABASE_URL == ''
        run: |
          echo "::notice::SUPABASE_URL belum di-set di GitHub Secrets — langkah build dilewati."
          echo "Set Secrets SUPABASE_URL + SUPABASE_ANON_KEY agar build penuh (termasuk prerender) ikut diperiksa."
