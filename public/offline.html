<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#082b59" />
    <title>Sedang Offline — SMP Muhammadiyah 4 Tanggul</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f8fb;
        color: #1e293b;
        text-align: center;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #fff;
        border: 1px solid #dce3ed;
        border-radius: 16px;
        padding: 32px 24px;
        box-shadow: 0 10px 30px rgba(8, 43, 89, 0.08);
      }
      img { width: 72px; height: 72px; object-fit: contain; }
      h1 { margin: 16px 0 8px; font-size: 20px; color: #082b59; }
      p { margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #475569; }
      button {
        border: 0;
        border-radius: 10px;
        background: #082b59;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 22px;
        cursor: pointer;
      }
      button:hover { background: #0a3a78; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/images/Logo-Favicon.png" alt="Logo SMP Muhammadiyah 4 Tanggul" width="72" height="72" />
      <h1>Anda sedang offline</h1>
      <p>
        Sambungan internet terputus. Periksa kembali jaringan Anda, lalu coba
        muat ulang halaman.
      </p>
      <button type="button" onclick="location.reload()">Coba Lagi</button>
    </main>
  </body>
</html>
